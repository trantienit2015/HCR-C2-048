[project]
name = "hcr-c2-048"
version = "0.1.0"
description = "Medical Equipment & Pharma Procurement Compliance Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repo arm — ci_stubs/ on PYTHONPATH for ci_stubs-era repos,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests job in .gitlab-ci.yml). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# Resolves against the module BEING CHECKED, not the base class's module, so it
# cannot be scoped into an override -- every node subclassing the untyped framework
# would trip it otherwise.
disallow_subclassing_any = false
# src/examples/ holds the scaffold's illustrative sample graphs. They import
# placeholder module names (src.nodes.step_a_node, src.tools.your_tools) that a real
# template never creates, so type-checking them reports missing modules that are
# missing by design. They are referenced by nothing in src/, tests/ or config/.
exclude = "^src/examples/"

[[tool.mypy.overrides]]
# This one resolves against the IMPORTED module, so scoping it here does work.
module = ["framework.*", "shared.*"]
ignore_missing_imports = true
